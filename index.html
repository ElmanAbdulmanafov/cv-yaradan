<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>CV Creator — Peşəkar CV hazırla</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f4f9; --panel:#ffffff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
    --primary:#2563eb; --primary-dark:#1d4ed8; --danger:#dc2626; --accent:#2563eb;
    --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}

  /* ---------- Header ---------- */
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:calc(12px + var(--sat)) 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
  .logo .badge{background:var(--primary);color:#fff;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:14px}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  .btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;font-family:inherit}
  .btn:hover{background:#f8fafc;border-color:#cbd5e1}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn.danger{color:var(--danger)}
  .btn.danger:hover{background:#fef2f2;border-color:#fecaca}
  .btn.small{padding:6px 10px;font-size:13px}
  .btn.icon{padding:7px 9px}

  /* ---------- Layout ---------- */
  main{display:grid;grid-template-columns:440px 1fr;gap:22px;padding:22px;max-width:1500px;margin:0 auto}
  .editor{display:flex;flex-direction:column;gap:14px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;font-weight:600;font-size:15px}
  .card-head .chev{transition:.2s;color:var(--muted)}
  .card.collapsed .chev{transform:rotate(-90deg)}
  .card.collapsed .card-body{display:none}
  .card-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field label{font-size:12.5px;font-weight:500;color:var(--muted)}
  input[type=text],input[type=email],input[type=tel],input[type=url],input[type=month],textarea,select{
    width:100%;border:1px solid var(--border);border-radius:7px;padding:10px 11px;font:inherit;font-size:14px;color:var(--text);background:#fff;outline:none;transition:.15s;min-width:0}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{resize:vertical;min-height:70px;line-height:1.5}
  .hint{font-size:12px;color:var(--muted)}

  .item{border:1px dashed var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fafbfd}
  .item-actions{display:flex;justify-content:space-between;align-items:center}
  .item-actions .num{color:var(--muted);font-size:12px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:#eef2ff;color:#3730a3;padding:6px 10px;border-radius:999px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .tag button{border:none;background:none;cursor:pointer;color:#6366f1;font-size:16px;line-height:1;padding:0 2px}
  .photo-row{display:flex;align-items:center;gap:14px}
  .photo-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:#f1f5f9}

  /* ---------- Design controls ---------- */
  .templates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tpl{border:2px solid var(--border);border-radius:8px;padding:6px;cursor:pointer;text-align:center;font-size:12px;font-weight:500;transition:.15s;background:#fff}
  .tpl:hover{border-color:#94a3b8}
  .tpl.active{border-color:var(--primary);background:#eff6ff}
  .tpl .thumb{height:58px;border-radius:4px;margin-bottom:5px;background:#f1f5f9;position:relative;overflow:hidden}
  .tpl .thumb i{position:absolute;background:var(--accent);display:block}
  .colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s}
  .swatch.active{border-color:#1e293b}
  .colors input[type=color]{width:30px;height:30px;border:none;padding:0;background:none;cursor:pointer}
  .range-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .range-row input{flex:1}

  /* ---------- Preview ---------- */
  .preview-wrap{position:sticky;top:84px;align-self:start;min-width:0}
  .preview-scroll{overflow:auto;max-height:calc(100vh - 110px);padding:10px;border-radius:var(--radius)}
  .scale-box{position:relative;margin:0 auto}
  .scale-inner{transform-origin:top left}
  .page{width:210mm;min-height:297mm;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);color:#1f2937;font-size:var(--fs,10.5pt);line-height:1.45;position:relative;font-family:'Inter',Roboto,system-ui,sans-serif}
  .page a{color:inherit;text-decoration:none}
  .page h1,.page h2,.page h3{line-height:1.2}
  .page ul{padding-left:16px;margin:2px 0}
  .page .desc{white-space:pre-line}
  .page .empty-note{color:#9ca3af;font-style:italic}
  .page .sec{break-inside:auto}
  .page .entry{break-inside:avoid;page-break-inside:avoid}
  .page .photo{object-fit:cover}

  /* Generic entry markup: .entry > .date + .ebody */
  .page .entry{display:flex;gap:12px;margin-bottom:11px}
  .page .entry .ebody{flex:1;min-width:0}
  .page .entry .date{order:2;white-space:nowrap;color:#6b7280;font-size:9.3pt;padding-top:2px;font-weight:500}
  .page .entry .top{font-weight:700}
  .page .entry .sub{color:#4b5563;font-size:9.8pt}
  .page .contact-list div{display:flex;gap:7px;align-items:flex-start;margin-bottom:6px;word-break:break-word;font-size:9.5pt}
  .page .bar{height:5px;background:rgba(0,0,0,.1);border-radius:3px;margin-top:4px}
  .page .bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
  .page .skill{margin-bottom:8px;font-size:9.5pt}
  .page .pill{display:inline-block;border:1px solid var(--accent);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:9pt;margin:0 6px 6px 0}
  .page .pill.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
  .page .pill .pill-lvl{opacity:.75;font-size:8.3pt}
  .page .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px;font-size:9.8pt}
  .page .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;font-size:9.8pt}
  .page .dotlist div{display:flex;justify-content:space-between;margin-bottom:4px;font-size:9.8pt}
  .page .dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d1d5db;margin-left:3px}
  .page .dots i.on{background:var(--accent)}
  .page .lvl{color:#6b7280;font-size:9.3pt}

  /* ====== 1. Modern ====== */
  .t-modern{display:grid;grid-template-columns:34% 66%;min-height:297mm}
  .t-modern .side{background:var(--accent);color:#fff;padding:28px 20px}
  .t-modern .side .photo{width:120px;height:120px;border-radius:50%;border:4px solid rgba(255,255,255,.35);display:block;margin:0 auto 18px}
  .t-modern .side h3{font-size:11pt;text-transform:uppercase;letter-spacing:1.2px;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:5px;margin:18px 0 10px}
  .t-modern .side .bar{background:rgba(255,255,255,.3)}
  .t-modern .side .bar span{background:#fff}
  .t-modern .main{padding:30px 28px}
  .t-modern .main h1{font-size:24pt;font-weight:700;color:#111827}
  .t-modern .main .title{font-size:12pt;color:var(--accent);font-weight:600;margin:4px 0 16px}
  .t-modern .main h2{font-size:12.5pt;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--accent)}

  /* ====== 2. Classic ====== */
  .t-classic{font-family:'Merriweather',Georgia,serif}
  .t-classic .head{background:var(--accent);color:#fff;padding:28px 36px;display:flex;align-items:center;gap:24px}
  .t-classic .head .photo{width:95px;height:95px;border-radius:50%;border:3px solid rgba(255,255,255,.5)}
  .t-classic .head h1{font-size:24pt;font-weight:700}
  .t-classic .head .title{font-size:12pt;opacity:.9;margin-top:4px}
  .t-classic .contact{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 36px;background:#f3f4f6;font-size:9.5pt;font-family:'Inter',sans-serif;color:#374151}
  .t-classic .body{padding:20px 36px 36px;display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
  .t-classic .body .full{grid-column:1/-1}
  .t-classic h2{font-size:12.5pt;color:var(--accent);margin:16px 0 10px;padding-bottom:4px;border-bottom:1.5px solid var(--accent)}
  .t-classic .entry .date{font-family:'Inter',sans-serif;font-weight:400}

  /* ====== 3. Minimal ====== */
  .t-minimal{padding:40px 44px}
  .t-minimal .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #111827;padding-bottom:16px}
  .t-minimal .head h1{font-size:26pt;font-weight:700;letter-spacing:-.5px}
  .t-minimal .head .title{font-size:12pt;color:var(--accent);font-weight:600;margin-top:4px}
  .t-minimal .head .contact{text-align:right;font-size:9.5pt;color:#4b5563;line-height:1.7}
  .t-minimal .head .photo{width:85px;height:85px;border-radius:8px;float:left;margin-right:16px}
  .t-minimal h2{font-size:10.5pt;text-transform:uppercase;letter-spacing:2px;color:#6b7280;margin:20px 0 10px;font-weight:600}
  .t-minimal .entry{display:grid;grid-template-columns:105px 1fr;gap:14px}
  .t-minimal .entry .date{order:0;white-space:normal}
  .t-minimal .grid3 div::before{content:'•';color:var(--accent);margin-right:6px;font-weight:700}

  /* ====== 4. Creative ====== */
  .t-creative .head{background:var(--accent);color:#fff;padding:34px 40px 30px;display:flex;align-items:center;gap:26px;position:relative}
  .t-creative .head::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:8px;background:var(--accent);opacity:.35}
  .t-creative .head .photo{width:110px;height:110px;border-radius:50%;border:5px solid rgba(255,255,255,.6)}
  .t-creative .head h1{font-size:28pt;font-weight:700;letter-spacing:-.5px}
  .t-creative .head .title{font-size:13pt;opacity:.92;margin-top:4px;font-weight:500}
  .t-creative .body{display:grid;grid-template-columns:62% 38%;min-height:calc(297mm - 190px);margin-top:8px}
  .t-creative .left{padding:26px 28px 30px 40px}
  .t-creative .right{padding:26px 30px 30px 24px;background:var(--accent-tint8)}
  .t-creative h2{font-size:12pt;margin:16px 0 10px;padding-left:10px;border-left:4px solid var(--accent);text-transform:uppercase;letter-spacing:.8px;color:#111827}
  .t-creative .right .contact-list{margin-bottom:6px}

  /* ====== 5. Corporate ====== */
  .t-corporate{display:grid;grid-template-columns:64% 36%;min-height:297mm}
  .t-corporate .main{padding:36px 28px 36px 38px}
  .t-corporate .side{background:#f3f4f6;padding:36px 24px}
  .t-corporate .side .photo{width:130px;height:130px;border-radius:8px;display:block;margin:0 auto 20px}
  .t-corporate h1{font-size:25pt;font-weight:700;color:#111827}
  .t-corporate .title{font-size:12pt;color:var(--accent);font-weight:600;margin:4px 0 14px}
  .t-corporate h2{font-size:11.5pt;text-transform:uppercase;letter-spacing:1.2px;margin:18px 0 10px;display:flex;align-items:center;gap:8px;color:#111827}
  .t-corporate h2::before{content:'';width:10px;height:10px;background:var(--accent);flex:none}
  .t-corporate .side h2{font-size:10.5pt}

  /* ====== 6. Elegant ====== */
  .t-elegant{padding:40px 48px;font-family:'Merriweather',Georgia,serif}
  .t-elegant .head{text-align:center;padding-bottom:16px;border-bottom:1px solid #111827;position:relative}
  .t-elegant .head::after{content:'';position:absolute;left:0;right:0;bottom:-4px;border-bottom:1px solid #111827}
  .t-elegant .head .photo{width:95px;height:95px;border-radius:50%;margin:0 auto 12px;display:block;border:2px solid var(--accent)}
  .t-elegant .head h1{font-size:24pt;font-weight:700;text-transform:uppercase;letter-spacing:4px}
  .t-elegant .head .title{font-size:11.5pt;color:var(--accent);margin-top:6px;letter-spacing:2px;text-transform:uppercase;font-family:'Inter',sans-serif}
  .t-elegant .head .contact{margin-top:10px;font-size:9.3pt;color:#4b5563;font-family:'Inter',sans-serif;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px}
  .t-elegant h2{font-size:11pt;text-transform:uppercase;letter-spacing:3px;text-align:center;margin:22px 0 12px;color:#111827;display:flex;align-items:center;gap:14px}
  .t-elegant h2::before,.t-elegant h2::after{content:'';flex:1;border-top:1px solid #cbd5e1}
  .t-elegant .entry .date{font-family:'Inter',sans-serif;font-weight:400}
  .t-elegant .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
  .t-elegant .center{text-align:center}

  /* ====== 7. Timeline ====== */
  .t-timeline{padding:36px 42px}
  .t-timeline .head{display:flex;align-items:center;gap:22px;margin-bottom:8px}
  .t-timeline .head .photo{width:100px;height:100px;border-radius:50%;border:4px solid var(--accent)}
  .t-timeline .head h1{font-size:26pt;font-weight:700;color:var(--accent)}
  .t-timeline .head .title{font-size:12pt;color:#374151;font-weight:600;margin-top:2px}
  .t-timeline .contactbar{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:9.5pt;color:#374151;padding:10px 0;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;margin:12px 0 6px}
  .t-timeline h2{font-size:12pt;text-transform:uppercase;letter-spacing:1.5px;margin:18px 0 10px;color:#111827}
  .t-timeline h2 span{background:var(--accent);color:#fff;padding:3px 10px;border-radius:4px}
  .t-timeline .tl .entry{display:grid;grid-template-columns:95px 22px 1fr;gap:0 8px;margin-bottom:0;padding-bottom:12px;position:relative}
  .t-timeline .tl .entry .date{order:0;white-space:normal;text-align:right;padding-top:1px}
  .t-timeline .tl .entry .node{position:relative}
  .t-timeline .tl .entry .node::before{content:'';position:absolute;left:9px;top:0;bottom:-12px;width:2px;background:#e5e7eb}
  .t-timeline .tl .entry:last-child .node::before{display:none}
  .t-timeline .tl .entry .node::after{content:'';position:absolute;left:5px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #fff}
  .t-timeline .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}

  /* ====== 8. Compact ====== */
  .t-compact{padding:28px 32px;font-size:calc(var(--fs,10.5pt) - .7pt);line-height:1.35}
  .t-compact .head{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#111827;color:#fff;padding:16px 20px;border-radius:6px}
  .t-compact .head h1{font-size:20pt;font-weight:700}
  .t-compact .head .title{font-size:11pt;color:var(--accent-light);font-weight:600}
  .t-compact .head .contact{text-align:right;font-size:8.8pt;line-height:1.6;opacity:.92}
  .t-compact .head .photo{width:70px;height:70px;border-radius:6px;margin-right:14px}
  .t-compact .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:6px}
  .t-compact h2{font-size:10pt;text-transform:uppercase;letter-spacing:1px;margin:14px 0 7px;padding:3px 8px;background:var(--accent-tint12);color:var(--accent);border-left:3px solid var(--accent)}
  .t-compact .entry{margin-bottom:8px;flex-direction:column;gap:0}
  .t-compact .entry .date{order:0;font-size:8.6pt;padding:0}
  .t-compact ul{margin:1px 0}

  /* ---------- Tab bar (mobile) ---------- */
  .tabbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);z-index:30;padding-bottom:var(--sab)}
  .tabbar button{flex:1;border:none;background:none;padding:10px 4px 8px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .tabbar button .ic{font-size:20px;line-height:1}
  .tabbar button.active{color:var(--primary);font-weight:600}
  .tabbar button.pdf{color:#fff;background:var(--primary);margin:6px;border-radius:10px;padding:8px 4px}

  @media(max-width:900px){
    header{padding-left:14px;padding-right:14px}
    .logo span.txt{display:none}
    .btn .lbl{display:none}
    .btn{padding:8px 10px}
    #btnPrint{display:none}
    main{grid-template-columns:1fr;padding:12px;padding-bottom:calc(80px + var(--sab));gap:12px}
    main[data-view=edit] .preview-wrap{display:none}
    main[data-view=preview] .editor{display:none}
    .preview-wrap{position:static}
    .preview-scroll{max-height:none;padding:0;overflow:visible}
    .tabbar{display:flex}
    .templates{grid-template-columns:repeat(4,1fr)}
    .row{grid-template-columns:1fr 1fr}
    .hint.desktop{display:none}
  }
  @media(max-width:420px){ .row{grid-template-columns:1fr} .row > .field[style]{grid-column:auto!important} }

  /* ---------- Toast / overlay ---------- */
  .toast{position:fixed;bottom:calc(84px + var(--sab));left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);backdrop-filter:blur(2px);display:none;place-items:center;z-index:60;font-weight:600;font-size:15px;color:var(--text)}
  .overlay.show{display:grid}
  .overlay.dialog{background:rgba(15,23,42,.45);backdrop-filter:none}
  .dlg-box{background:#fff;border-radius:12px;padding:22px;max-width:340px;width:calc(100vw - 40px);box-shadow:0 12px 40px rgba(0,0,0,.25);font-weight:400;font-size:15px}
  .dlg-box p{margin-bottom:18px;line-height:1.5}
  .dlg-actions{display:flex;justify-content:flex-end;gap:8px}
  .spinner{width:36px;height:36px;border:4px solid #dbeafe;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Print ---------- */
  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    header,.editor,.toast,.tabbar,.overlay{display:none!important}
    main{display:block;padding:0;margin:0;max-width:none}
    .preview-wrap{position:static}
    .preview-scroll{overflow:visible;max-height:none;padding:0}
    .scale-box{height:auto!important}
    .scale-inner{transform:none!important}
    .page{box-shadow:none;margin:0;width:210mm;min-height:auto}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  .lang-sel{width:auto;flex:none;padding:8px 6px;font-weight:600;cursor:pointer;appearance:auto;-webkit-appearance:auto}
  .tpl .tpl-name{display:block;line-height:1.2}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="badge">CV</span><span class="txt">CV Creator</span></div>
  <div class="toolbar">
    <select class="btn lang-sel" id="uiLang" aria-label="Language / Dil / Язык">
      <option value="az">🌐 AZ</option><option value="en">🌐 EN</option><option value="ru">🌐 RU</option>
    </select>
    <button class="btn" id="btnImport" data-i-title="importTitle">📂<span class="lbl" data-i="import">Yüklə</span></button>

        </div>

            <select id="skillLevel"></select>
            <button class="btn small" id="addSkill" data-i-title="add">＋</button>
          </div>
        </div>
        <div class="tags" id="skillTags"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head" data-toggle><span data-i="cardLangs">🌍 Dillər</span> <span class="chev">▾</span></div>
      <div class="card-body">
        <div class="field"><label data-i="langHelp">Dil yazın və “＋” basın</label>
          <div class="row" style="grid-template-columns:1fr 140px 44px">
            <input type="text" id="langInput" data-i-ph="phLang" enterkeyhint="done">

            <button class="btn small" id="addLang" data-i-title="add">＋</button>
          </div>
        </div>
        <div class="tags" id="langTags"></div>

  </section>
</main>

      summary:'Frontend-разработчик с опытом более 5 лет. Создаю быстрые и удобные интерфейсы на React, TypeScript и современных веб-технологиях. Люблю работать в команде и изучать новые технологии.',
      exp:[['Ведущий Frontend-разработчик','ООО «TechAz»','Баку','• Руководил frontend-командой из 6 человек\n• Ускорил загрузку страниц на 45%\n• Создал дизайн-систему с нуля'],
           ['Frontend-разработчик','Digital Solutions','Баку','• Реализовал 10+ проектов на React и Redux\n• Интеграции REST API и автоматизация тестирования']],
      edu:['Бакалавр, Информационные технологии','Азербайджанский технический университет'],

};
const LANG_KEYS = ['native','C1','B2','B1','A2','A1'];
const L = () => I18N[state.lang] || I18N.az;
const tu = k => L().ui[k] ?? I18N.az.ui[k] ?? k;
const tm = k => L().msg[k] ?? I18N.az.msg[k] ?? k;
// language level stored as key; older saves stored the Azerbaijani label
function lvlKey(v){ if(LANG_KEYS.includes(v)) return v; for(const lg of Object.values(I18N)) for(const k of LANG_KEYS) if(lg.lvl[k]===v) return k; return v; }
const lvlName = v => L().lvl[lvlKey(v)] || v;
const skillLevelName = v => L().skill[v] || v;

/* ==================== TEMPLATES ==================== */
const TEMPLATES = [
  ['modern','<i style="left:0;top:0;bottom:0;width:32%"></i>'],
  ['classic','<i style="left:0;right:0;top:0;height:22%"></i>'],

  ['elegant','<i style="left:28%;right:28%;top:26%;height:2px"></i><i style="left:28%;right:28%;top:32%;height:1px"></i><i style="left:40%;right:40%;top:60%;height:1px;opacity:.5"></i>'],
  ['timeline','<i style="left:24%;top:30%;bottom:8%;width:2px;opacity:.4"></i><i style="left:20%;top:38%;width:9px;height:9px;border-radius:50%"></i><i style="left:20%;top:68%;width:9px;height:9px;border-radius:50%"></i>'],
  ['compact','<i style="left:8%;right:8%;top:8%;height:16%;background:#111827"></i><i style="left:8%;top:36%;width:38%;height:4px"></i><i style="left:54%;top:36%;width:38%;height:4px"></i><i style="left:8%;top:66%;width:38%;height:4px"></i><i style="left:54%;top:66%;width:38%;height:4px"></i>'],
];

/* ==================== STATE ==================== */
const STORAGE_KEY = 'cv-generator-v1';
const guessLang = () => { const n=(navigator.language||'az').slice(0,2).toLowerCase(); return n==='ru'?'ru':n==='en'?'en':'az'; };
const defaultState = () => ({
  lang: guessLang(), template:'modern', accent:'#2563eb', fontSize:10.5, photo:'',
  name:'', title:'', email:'', phone:'', location:'', website:'', birth:'', license:'', summary:'', hobbies:'',
  experience:[], education:[], certificates:[], skills:[], languages:[]
});
let state = Object.assign(defaultState(), load() || {});
if(!I18N[state.lang]) state.lang = 'az';
state.languages = (state.languages||[]).map(l => ({...l, level:lvlKey(l.level)}));

function load(){ try{ const d=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(d && !d.lang) d.lang='az'; return d; }catch(e){ return null; } }
let saveTimer;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }, 300); }
function update(){ save(); render(); }

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

function toast(msg, ms=2200){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms); }

/* ==================== EDITOR BINDINGS ==================== */
$$('[data-toggle]').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed')));

$$('[data-k]').forEach(el => {
  el.value = state[el.dataset.k] || '';
  el.addEventListener('input', () => { state[el.dataset.k] = el.value; update(); });
});

// templates grid
$('#templates').innerHTML = TEMPLATES.map(([k,th]) => `<div class="tpl" data-t="${k}"><div class="thumb">${th}</div><span class="tpl-name"></span></div>`).join('');
$$('.tpl').forEach(t => t.addEventListener('click', () => { state.template = t.dataset.t; syncDesign(); update(); }));
$$('.swatch').forEach(s => s.addEventListener('click', () => { state.accent = s.dataset.c; syncDesign(); update(); }));
$('#customColor').addEventListener('input', e => { state.accent = e.target.value; syncDesign(); update(); });
$('#fontSize').addEventListener('input', e => { state.fontSize = +e.target.value; syncDesign(); update(); });

function syncDesign(){
  $$('.tpl').forEach(t => t.classList.toggle('active', t.dataset.t === state.template));
  $$('.swatch').forEach(s => s.classList.toggle('active', s.dataset.c === state.accent));
  $('#customColor').value = state.accent;
  $('#fontSize').value = state.fontSize;
  $('#fontSizeVal').textContent = state.fontSize + 'pt';
  const root=document.documentElement.style;
  root.setProperty('--accent', state.accent);
  root.setProperty('--accent-tint8', mix(state.accent,'#ffffff',.08));
  root.setProperty('--accent-tint12', mix(state.accent,'#ffffff',.12));
  root.setProperty('--accent-light', mix(state.accent,'#ffffff',.6));
}
// mix(a,b,w): w share of colour a over b, returns hex (html2canvas does not support color-mix())
function mix(a,b,w){ const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)); const A=h(a),B=h(b);
  return '#'+A.map((v,i)=>Math.round(v*w+B[i]*(1-w)).toString(16).padStart(2,'0')).join(''); }

// photo
$('#pickPhoto').addEventListener('click', () => $('#photo').click());
$('#photo').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 500, r = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    state.photo = c.toDataURL('image/jpeg', .85); URL.revokeObjectURL(url);
    syncPhoto(); update();
  };
  img.onerror = () => toast(tm('photoErr'));
  img.src = url; e.target.value = '';
});
$('#removePhoto').addEventListener('click', () => { state.photo=''; syncPhoto(); update(); });
const PHOTO_DEFAULT = $('#photoPreview').src;
function syncPhoto(){ $('#photoPreview').src = state.photo || PHOTO_DEFAULT; }

/* ---- Repeating lists (labels come from I18N[lang].fields) ---- */
const listDefs = {
  experience:{ el:'#expList', add:'#addExp', fields:[['position'],['company'],['start','month'],['end','month'],['location'],['desc','textarea']] },
  education:{ el:'#eduList', add:'#addEdu', fields:[['degree'],['school'],['start','month'],['end','month'],['desc','textarea']] },
  certificates:{ el:'#certList', add:'#addCert', fields:[['name'],['issuer'],['date','month'],['url','url']] },
};
const MONTH_PH = {start:'2021-01', end:'2024-06', date:'2023-05'};

function renderList(key){
  const def = listDefs[key]; const wrap = $(def.el); wrap.innerHTML=''; wrap.style.cssText='display:flex;flex-direction:column;gap:10px';
  const F = L().fields[key];
  state[key].forEach((item, idx) => {
    const d = document.createElement('div'); d.className='item';
    const fieldsHtml = def.fields.map(([k,type]) => {
      const t = type||'text'; const [label, ph0] = F[k]; const ph = ph0 ?? MONTH_PH[k] ?? '';
      const input = t==='textarea'
        ? `<textarea data-f="${k}" placeholder="${esc(ph)}">${esc(item[k]||'')}</textarea>`
        : `<input type="${t}" data-f="${k}" placeholder="${esc(ph)}" value="${esc(item[k]||'')}">`;
      return `<div class="field" ${t==='textarea'?'style="grid-column:1/-1"':''}><label>${esc(label)}</label>${input}</div>`;
    }).join('');
    d.innerHTML = `<div class="row">${fieldsHtml}</div>
      <div class="item-actions"><span class="num">#${idx+1}</span>
      <div style="display:flex;gap:6px">
        <button class="btn small icon" data-act="up" title="${esc(tu('up'))}" ${idx===0?'disabled':''}>↑</button>
        <button class="btn small icon" data-act="down" title="${esc(tu('down'))}" ${idx===state[key].length-1?'disabled':''}>↓</button>
        <button class="btn small danger" data-act="del">${esc(tu('del'))}</button></div></div>`;
    d.querySelectorAll('[data-f]').forEach(inp => inp.addEventListener('input', () => { item[inp.dataset.f] = inp.value; update(); }));
    d.querySelector('[data-act=del]').onclick = () => { state[key].splice(idx,1); renderList(key); update(); };
    d.querySelector('[data-act=up]').onclick = () => { [state[key][idx-1],state[key][idx]]=[state[key][idx],state[key][idx-1]]; renderList(key); update(); };
    d.querySelector('[data-act=down]').onclick = () => { [state[key][idx+1],state[key][idx]]=[state[key][idx],state[key][idx+1]]; renderList(key); update(); };
    wrap.appendChild(d);
  });
}
Object.entries(listDefs).forEach(([key,def]) => {
  $(def.add).addEventListener('click', () => { state[key].push({id:uid()}); renderList(key); update();
    const items = $(def.el).querySelectorAll('.item'); items[items.length-1]?.querySelector('input')?.focus(); });
});

/* ---- Tags ---- */
function bindTags(key, inputSel, levelSel, addSel, tagsSel, levelLabel){
  const input=$(inputSel), level=$(levelSel), wrap=$(tagsSel);
  const add = () => { const v=input.value.trim(); if(!v) return; state[key].push({name:v, level:key==='skills'?+level.value:level.value}); input.value=''; renderTags(); update(); };
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); add(); } });
  $(addSel).addEventListener('click', add);
  function renderTags(){
    wrap.innerHTML = state[key].map((s,i)=>`<span class="tag">${esc(s.name)} <small style="opacity:.7">· ${esc(levelLabel(s.level))}</small><button data-i="${i}" title="${esc(tu('del'))}">×</button></span>`).join('');
    wrap.querySelectorAll('button').forEach(b => b.onclick = () => { state[key].splice(+b.dataset.i,1); renderTags(); update(); });
  }
  return renderTags;
}
const renderSkills = bindTags('skills','#skillInput','#skillLevel','#addSkill','#skillTags', skillLevelName);
const renderLangs  = bindTags('languages','#langInput','#langLevel','#addLang','#langTags', lvlName);

/* ---- Apply UI language ---- */
function fillSelect(sel, pairs, fallback){
  const cur = sel.value || fallback;
  sel.innerHTML = pairs.map(([v,n]) => `<option value="${v}">${esc(n)}</option>`).join('');
  sel.value = cur;
}
function applyLang(){
  const lg = state.lang;
  document.documentElement.lang = lg;
  document.title = L().docTitle;
  $('#uiLang').value = lg;
  $$('[data-i]').forEach(el => { if(el.closest('.tags')) return; el.textContent = tu(el.dataset.i); });
  $$('[data-i-ph]').forEach(el => el.placeholder = tu(el.dataset.iPh));
  $$('[data-i-title]').forEach(el => el.title = tu(el.dataset.iTitle));
  $$('.tpl').forEach(t => t.querySelector('.tpl-name').textContent = L().tpl[t.dataset.t]);
  fillSelect($('#skillLevel'), [100,80,60,40].map(v => [v, L().skill[v]]), '80');
  fillSelect($('#langLevel'), LANG_KEYS.map(k => [k, L().lvl[k]]), 'C1');
  Object.keys(listDefs).forEach(renderList);
  renderSkills(); renderLangs();
}
$('#uiLang').addEventListener('change', e => { state.lang = e.target.value; applyLang(); update(); });

/* ==================== PREVIEW BUILDING BLOCKS ==================== */
function fmtDate(v){ if(!v) return ''; const [y,m]=v.split('-'); return m ? `${L().months[+m-1]} ${y}` : y; }
function range(a,b, ongoing=L().present){ const s=fmtDate(a), e=fmtDate(b); if(!s&&!e) return ''; return `${s}${s&&(e||ongoing)?' – ':''}${e||(s?ongoing:'')}`; }
function descHtml(d){ if(!d) return ''; const lines=d.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length && lines.every(l=>/^[•\-\*]/.test(l))) return `<ul>${lines.map(l=>`<li>${esc(l.replace(/^[•\-\*]\s*/,''))}</li>`).join('')}</ul>`;
  return `<div class="desc">${esc(d)}</div>`; }
const nz = arr => arr.filter(x => Object.entries(x).some(([k,v]) => k!=='id' && v));
const hobbyList = () => (state.hobbies||'').split(',').map(s=>s.trim()).filter(Boolean);

function contactItems(s){
  const items=[];
  if(s.email) items.push(['✉', `<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`]);
  if(s.phone) items.push(['☎', esc(s.phone)]);
  if(s.location) items.push(['📍', esc(s.location)]);
  if(s.website) items.push(['🔗', `<a href="${esc(/^https?:/.test(s.website)?s.website:'https://'+s.website)}">${esc(s.website.replace(/^https?:\/\//,''))}</a>`]);
  if(s.birth) items.push(['🎂', esc(s.birth)]);
  if(s.license) items.push(['🚗', esc(s.license)]);
  return items;
}
const empty = k => `<span class="empty-note">${esc(L().sec[k])}</span>`;
// entry: generic markup; `node` adds timeline node column
const entry = (date, top, sub, body, node=false) => `<div class="entry"><div class="date">${date}</div>${node?'<div class="node"></div>':''}<div class="ebody"><div class="top">${top}</div>${sub?`<div class="sub">${sub}</div>`:''}${body||''}</div></div>`;
const expEntries = (node) => nz(state.experience).map(e => entry(range(e.start,e.end), esc(e.position)||empty('position'), [esc(e.company),esc(e.location)].filter(Boolean).join(' · '), descHtml(e.desc), node)).join('');
const eduEntries = (node) => nz(state.education).map(e => entry(range(e.start,e.end,''), esc(e.degree)||empty('degree'), esc(e.school), descHtml(e.desc), node)).join('');
const certEntries = (node) => nz(state.certificates).map(c => entry(fmtDate(c.date), c.url?`<a href="${esc(c.url)}">${esc(c.name)}</a>`:esc(c.name), esc(c.issuer), '', node)).join('');

const skillsBars = () => state.skills.map(k=>`<div class="skill">${esc(k.name)}<div class="bar"><span style="width:${k.level}%"></span></div></div>`).join('');
const skillsPills = (solid) => state.skills.map(k=>`<span class="pill ${solid?'solid':''}">${esc(k.name)} <span class="pill-lvl">· ${esc(skillLevelName(k.level))}</span></span>`).join('');
const skillsDots = () => state.skills.map(k=>`<div class="dotlist"><div><span>${esc(k.name)}</span><span class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=Math.round(k.level/20)?'on':''}"></i>`).join('')}</span></div></div>`).join('');
const skillsGrid = (cols=3) => `<div class="grid${cols}">${state.skills.map(k=>`<div>${esc(k.name)} <span class="lvl">(${esc(skillLevelName(k.level))})</span></div>`).join('')}</div>`;
const langsList = () => `<div class="dotlist">${state.languages.map(l=>`<div><span>${esc(l.name)}</span><span class="lvl">${esc(lvlName(l.level))}</span></div>`).join('')}</div>`;
const contactList = (items) => `<div class="contact-list">${items.map(([i,v])=>`<div><span>${i}</span><span>${v}</span></div>`).join('')}</div>`;
const contactInline = (items, sep='') => items.map(([i,v])=>`<span>${i} ${v}</span>`).join(sep);
const sec = (title, body, cls='') => body ? `<section class="sec ${cls}"><h2>${title}</h2>${body}</section>` : '';
const secT = (title, body, cls='') => body ? `<section class="sec ${cls}"><h2><span>${title}</span></h2>${body}</section>` : '';
function skillsPillsFrom(arr){ return arr.map(h=>`<span class="pill">${esc(h)}</span>`).join(''); }

/* ==================== RENDER ==================== */
function render(){
  const s=state, page=$('#page'), S=L().sec; page.style.setProperty('--fs', s.fontSize+'pt');
  page.lang = s.lang;
  const name = esc(s.name)||empty('fullName');
  const title = esc(s.title);
  const ct = contactItems(s);
  const photo = (cls='photo') => s.photo?`<img class="${cls}" src="${s.photo}" alt="">`:'';
  const hasExp=nz(s.experience).length, hasEdu=nz(s.education).length, hasCert=nz(s.certificates).length;
  const hob = hobbyList();
  const summary = s.summary?`<div class="desc">${esc(s.summary)}</div>`:'';
  const T = s.template; let html='';

  if(T==='modern'){
    html = `<div class="t-modern"><aside class="side">${photo()}
        ${ct.length?`<h3>${S.contact}</h3>${contactList(ct)}`:''}
        ${s.skills.length?`<h3>${S.skills}</h3>${skillsBars()}`:''}
        ${s.languages.length?`<h3>${S.langs}</h3>${s.languages.map(l=>`<div class="skill">${esc(l.name)} <span style="opacity:.8;font-size:9pt">— ${esc(lvlName(l.level))}</span></div>`).join('')}`:''}
        ${hob.length?`<h3>${S.hobbies}</h3><div style="font-size:9.5pt">${hob.map(esc).join(' · ')}</div>`:''}
      </aside><div class="main"><h1>${name}</h1>${title?`<div class="title">${title}</div>`:''}
        ${sec(S.about,summary)}${sec(S.exp,hasExp&&expEntries())}${sec(S.edu,hasEdu&&eduEntries())}${sec(S.certs,hasCert&&certEntries())}
      </div></div>`;
  }
  else if(T==='classic'){
    html = `<div class="t-classic">
      <div class="head">${photo()}<div><h1>${name}</h1>${title?`<div class="title">${title}</div>`:''}</div></div>
      ${ct.length?`<div class="contact">${contactInline(ct)}</div>`:''}
      <div class="body">
        ${sec(S.about,summary,'full')}${sec(S.exp,hasExp&&expEntries(),'full')}
        ${sec(S.edu,hasEdu&&eduEntries(),hasCert?'':'full')}${sec(S.certs,hasCert&&certEntries(),hasEdu?'':'full')}
        ${sec(S.skills,s.skills.length&&skillsPills())}${sec(S.langs,s.languages.length&&langsList())}
        ${sec(S.hobbies,hob.length&&hob.map(esc).join(' · '),'full')}
      </div></div>`;
  }
  else if(T==='minimal'){
    html = `<div class="t-minimal">
      <div class="head"><div>${photo()}<h1>${name}</h1>${title?`<div class="title">${title}</div>`:''}</div>
        ${ct.length?`<div class="contact">${ct.map(([i,v])=>`<div>${v}</div>`).join('')}</div>`:''}</div>
      ${sec(S.about,summary)}${sec(S.exp,hasExp&&expEntries())}${sec(S.edu,hasEdu&&eduEntries())}${sec(S.certs,hasCert&&certEntries())}
      ${sec(S.skills,s.skills.length&&skillsGrid(3))}
      ${sec(S.langs,s.languages.length&&`<div class="grid3">${s.languages.map(l=>`<div>${esc(l.name)} <span class="lvl">(${esc(lvlName(l.level))})</span></div>`).join('')}</div>`)}
      ${sec(S.hobbies,hob.length&&hob.map(esc).join(' · '))}
    </div>`;
  }
  else if(T==='creative'){
    html = `<div class="t-creative">
      <div class="head">${photo()}<div><h1>${name}</h1>${title?`<div class="title">${title}</div>`:''}</div></div>
      <div class="body"><div class="left">
        ${sec(S.about,summary)}${sec(S.exp,hasExp&&expEntries())}${sec(S.edu,hasEdu&&eduEntries())}${sec(S.certs,hasCert&&certEntries())}
      </div><div class="right">
        ${sec(S.contact,ct.length&&contactList(ct))}${sec(S.skills,s.skills.length&&skillsBars())}
        ${sec(S.langs,s.languages.length&&langsList())}${sec(S.hobbies,hob.length&&skillsPillsFrom(hob))}
      </div></div></div>`;
  }
  else if(T==='corporate'){
    html = `<div class="t-corporate"><div class="main"><h1>${name}</h1>${title?`<div class="title">${title}</div>`:''}
        ${sec(S.profile,summary)}${sec(S.exp,hasExp&&expEntries())}${sec(S.edu,hasEdu&&eduEntries())}${sec(S.certs,hasCert&&certEntries())}
      </div><aside class="side">${photo()}
        ${sec(S.contact,ct.length&&contactList(ct))}${sec(S.skills,s.skills.length&&skillsBars())}
        ${sec(S.langs,s.languages.length&&langsList())}${sec(S.hobbies,hob.length&&hob.map(esc).join(', '))}
      </aside></div>`;
  }
  else if(T==='elegant'){
    html = `<div class="t-elegant">
      <div class="head">${photo()}<h1>${name}</h1>${title?`<div class="title">${title}</div>`:''}
        ${ct.length?`<div class="contact">${ct.map(([i,v])=>`<span>${v}</span>`).join('')}</div>`:''}</div>
      ${sec(S.about,summary&&`<div class="center">${summary}</div>`)}${sec(S.exp,hasExp&&expEntries())}${sec(S.edu,hasEdu&&eduEntries())}${sec(S.certs,hasCert&&certEntries())}
      <div class="cols">${sec(S.skills,s.skills.length&&skillsDots())}${sec(S.langs,s.languages.length&&langsList())}</div>
      ${sec(S.hobbies,hob.length&&`<div class="center">${hob.map(esc).join(' · ')}</div>`)}
    </div>`;
  }
  else if(T==='timeline'){
    html = `<div class="t-timeline">
      <div class="head">${photo()}<div><h1>${name}</h1>${title?`<div class="title">${title}</div>`:''}</div></div>
      ${ct.length?`<div class="contactbar">${contactInline(ct)}</div>`:''}
      ${secT(S.about,summary)}
      ${secT(S.exp,hasExp&&`<div class="tl">${expEntries(true)}</div>`)}
      ${secT(S.edu,hasEdu&&`<div class="tl">${eduEntries(true)}</div>`)}
      ${secT(S.certs,hasCert&&`<div class="tl">${certEntries(true)}</div>`)}
      <div class="cols">${secT(S.skills,s.skills.length&&skillsPills(true))}${secT(S.langs,s.languages.length&&langsList())}</div>
      ${secT(S.hobbies,hob.length&&hob.map(esc).join(' · '))}
    </div>`;
  }
  else { // compact
    html = `<div class="t-compact">
      <div class="head"><div style="display:flex;align-items:center">${photo()}<div><h1>${name}</h1>${title?`<div class="title">${title}</div>`:''}</div></div>
        ${ct.length?`<div class="contact">${ct.map(([i,v])=>`<div>${v}</div>`).join('')}</div>`:''}</div>
      ${sec(S.about,summary)}
      <div class="cols"><div>${sec(S.exp,hasExp&&expEntries())}${sec(S.certs,hasCert&&certEntries())}</div>
      <div>${sec(S.edu,hasEdu&&eduEntries())}${sec(S.skills,s.skills.length&&skillsGrid(2))}${sec(S.langs,s.languages.length&&langsList())}${sec(S.hobbies,hob.length&&hob.map(esc).join(', '))}</div></div>
    </div>`;
  }
  page.innerHTML = html;
  fitPreview();
}

/* ---- Preview scaling (fit page width to container) ---- */
const PAGE_W = 794; // 210mm @ 96dpi
function fitPreview(){
  const box=$('#scaleBox'), inner=$('#scaleInner'), page=$('#page');
  const avail = $('#previewScroll').clientWidth - 20;
  if(avail <= 0) return; // preview hidden (mobile edit tab)
  const sc = Math.min(1, avail / PAGE_W);
  inner.style.transform = `scale(${sc})`;
  box.style.width = (PAGE_W*sc) + 'px';
  box.style.height = (page.offsetHeight*sc) + 'px';
}
window.addEventListener('resize', fitPreview);
new ResizeObserver(fitPreview).observe($('#page'));

/* ---- Mobile tabs ---- */
function setView(v){ $('#main').dataset.view = v; $$('#tabbar [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view===v)); if(v==='preview') { window.scrollTo(0,0); requestAnimationFrame(fitPreview); } }
$$('#tabbar [data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

/* ==================== PDF ==================== */
async function makePdf(){
  if(!state.name){ toast(tm('needName')); }
  const fname = (state.name||'CV').replace(/[^\p{L}\p{N}]+/gu,'_') + '_CV_' + state.lang.toUpperCase() + '.pdf';
  const btns = [$('#btnPrint'), $('#btnPdfMobile')]; btns.forEach(b=>b.disabled=true);
  $('#overlay').classList.add('show');
  try{
    const opt = { margin:0, filename:fname, image:{type:'jpeg',quality:.96},
      html2canvas:{scale:2, useCORS:true, logging:false, scrollX:0, scrollY:0, windowWidth:PAGE_W},
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'}, pagebreak:{mode:['css','legacy']} };
    const worker = html2pdf().set(opt).from($('#page'));
    if(isNative()){
      const uri = await worker.outputPdf('datauristring');
      const data = uri.split(',')[1];
      const { Filesystem, Share } = Capacitor.Plugins;
      const res = await Filesystem.writeFile({ path:fname, data, directory:'CACHE' });
      $('#overlay').classList.remove('show');
      await Share.share({ title:fname, url:res.uri, dialogTitle:tm('shareCv') });
    } else {
      await worker.save();
      toast(tm('pdfDone'));
    }
  }catch(err){ console.error(err); if(!/cancel/i.test(String(err?.message))) toast(tm('pdfFail')+(err?.message||err), 4000); }
  finally{ $('#overlay').classList.remove('show'); btns.forEach(b=>b.disabled=false); }
}
$('#btnPrint').addEventListener('click', makePdf);
$('#btnPdfMobile').addEventListener('click', makePdf);

/* ==================== TOOLBAR ==================== */
async function exportJson(){
  const json = JSON.stringify(state,null,2), fname=(state.name||'cv').replace(/[^\p{L}\p{N}]+/gu,'_')+'_cv.json';
  if(isNative()){
    try{ const { Filesystem, Share } = Capacitor.Plugins;
      const res = await Filesystem.writeFile({ path:fname, data:json, directory:'CACHE', encoding:'utf8' });
      await Share.share({ title:fname, url:res.uri, dialogTitle:tm('shareJson') }); }catch(e){ if(!/cancel/i.test(String(e?.message))) toast(tm('saveFail')); }
    return;
  }
  const blob = new Blob([json],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click(); URL.revokeObjectURL(a.href); toast(tm('jsonDone'));
}
$('#btnExport').addEventListener('click', exportJson);
$('#btnImport').addEventListener('click', () => $('#fileImport').click());
$('#fileImport').addEventListener('change', e => {
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload = () => { try{ const d=JSON.parse(r.result); if(typeof d!=='object'||!d) throw 0;
    const lang = I18N[d.lang] ? d.lang : state.lang;
    state = Object.assign(defaultState(), d, {lang}); state.languages = (state.languages||[]).map(l => ({...l, level:lvlKey(l.level)}));
    hydrate(); update(); toast(tm('loaded')); }catch(err){ toast(tm('readFail')); } };
  r.readAsText(f); e.target.value='';
});
// Custom confirm: native confirm() is blocked in some WebViews / embedded browsers
function askConfirm(msg){ return new Promise(res => {
  const dlg=$('#confirmDlg'); $('#confirmMsg').textContent=msg; dlg.classList.add('show');
  const done = v => { dlg.classList.remove('show'); $('#confirmYes').onclick=$('#confirmNo').onclick=null; res(v); };
  $('#confirmYes').onclick=()=>done(true); $('#confirmNo').onclick=()=>done(false);
  dlg.onclick = e => { if(e.target===dlg) done(false); };
}); }
$('#btnClear').addEventListener('click', async () => {
  if(!(await askConfirm(tm('confirmClear')))) return;
  const {lang,template,accent,fontSize}=state; state=Object.assign(defaultState(),{lang,template,accent,fontSize}); hydrate(); update(); toast(tm('cleared'));
});
$('#btnSample').addEventListener('click', () => {
  const {lang,template,accent,fontSize}=state, X=L().sample;
  state = Object.assign(defaultState(), {lang,template,accent,fontSize,
    name:X.name, title:X.title, email:'elman@example.com', phone:'+994 50 123 45 67', location:X.location, website:'linkedin.com/in/elman', birth:'15.03.1996', license:X.license,
    summary:X.summary,
    experience:[
      {id:uid(), position:X.exp[0][0], company:X.exp[0][1], location:X.exp[0][2], start:'2022-03', end:'', desc:X.exp[0][3]},
      {id:uid(), position:X.exp[1][0], company:X.exp[1][1], location:X.exp[1][2], start:'2019-07', end:'2022-02', desc:X.exp[1][3]}
    ],
    education:[{id:uid(), degree:X.edu[0], school:X.edu[1], start:'2014-09', end:'2018-06', desc:'GPA: 89/100'}],
    certificates:[{id:uid(), name:'Meta Front-End Developer', issuer:'Coursera', date:'2023-04', url:''}],
    skills:[{name:'JavaScript',level:100},{name:'React',level:100},{name:'TypeScript',level:80},{name:'CSS / Sass',level:80},{name:'Node.js',level:60},{name:'Figma',level:60}],
    languages:X.langs.map(([name,level])=>({name,level})),
    hobbies:X.hobbies
  });
  hydrate(); update(); toast(tm('sampleDone'));
});

/* ==================== HYDRATE ==================== */
function hydrate(){
  $$('[data-k]').forEach(el => el.value = state[el.dataset.k] || '');
  syncDesign(); syncPhoto();
  applyLang();
}
hydrate(); render();

/* ==================== NATIVE / PWA ==================== */
if(isNative() && Capacitor.Plugins.App){
  Capacitor.Plugins.App.addListener('backButton', () => {
    if($('#main').dataset.view==='preview') setView('edit'); else Capacitor.Plugins.App.exitApp();
  });
} else if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
